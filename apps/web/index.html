<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101720" />
    <title>Roborecon</title>
  </head>
  <body>
    <script>
      (() => {
        const storageKey = "roborecon-theme";
        let theme = "dark";
        try {
          theme = window.localStorage.getItem(storageKey) === "light" ? "light" : "dark";
        } catch {
          // Keep the dark default when storage is unavailable.
        }
        document.documentElement.classList.toggle("dark", theme === "dark");
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute(
          "content",
          theme === "dark" ? "#101720" : "#f4f6fa",
        );
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
